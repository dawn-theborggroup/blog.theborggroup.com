<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Southwest Florida Market Ticker | The Borg Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1f1f1f; --gold: #c4a35f; --gold-dim: #8f7a4c; --cream: #ece6da; --muted: #9a958c; --line: #3a3833; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--cream); font-family: Jost, Helvetica, Arial, sans-serif; font-weight: 300; }
  .wrap { padding: 10px 0 12px; }
  .head { display: flex; justify-content: center; align-items: baseline; gap: .6rem; flex-wrap: wrap; font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin: 0 12px 10px; text-align: center; }
  .head .dot { width: 7px; height: 7px; border-radius: 50%; background: #5fae7b; display: inline-block; box-shadow: 0 0 0 0 rgba(95,174,123,.6); animation: pulse 2.4s infinite; transform: translateY(-1px); }
  .head span.upd { color: var(--muted); letter-spacing: .12em; }
  .head a.full { color: var(--cream); text-decoration: none; letter-spacing: .14em; border-bottom: 1px solid var(--gold-dim); }
  .head a.full:hover { color: #fff; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(95,174,123,.55); } 70% { box-shadow: 0 0 0 7px rgba(95,174,123,0); } 100% { box-shadow: 0 0 0 0 rgba(95,174,123,0); } }
  .belt { position: relative; overflow: hidden; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .belt::before, .belt::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40px; z-index: 2; pointer-events: none; }
  .belt::before { left: 0; background: linear-gradient(90deg, var(--bg), transparent); }
  .belt::after { right: 0; background: linear-gradient(270deg, var(--bg), transparent); }
  .track { display: flex; width: max-content; animation: scroll var(--dur, 90s) linear infinite; }
  .belt:hover .track, .belt:focus-within .track { animation-play-state: paused; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  a.item { display: flex; align-items: center; gap: 14px; padding: 12px 26px; color: inherit; text-decoration: none; border-right: 1px solid var(--line); white-space: nowrap; }
  a.item:hover .area, a.item:focus .area { color: #fff; }
  .area { font-size: 12.5px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); transition: color .2s; }
  .seg { font-size: 13.5px; color: var(--cream); }
  .seg b { font-weight: 500; color: #fff; }
  .seg .t { color: var(--muted); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin-right: 6px; }
  .sep { color: var(--gold-dim); }
  .go { color: var(--gold); font-size: 13px; }
  .foot { text-align: center; font-size: 10px; color: var(--muted); margin: 8px 12px 0; letter-spacing: .04em; }
  @media (max-width: 600px) { a.item { padding: 11px 18px; gap: 10px; } .seg { font-size: 12.5px; } }
  @media (prefers-reduced-motion: reduce) {
    .track { animation: none; width: auto; flex-wrap: wrap; justify-content: center; }
    .track .dup { display: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><i class="dot" aria-hidden="true"></i>Southwest Florida market today <span class="upd" id="upd"></span> <a class="full" target="_top" href="https://blog.theborggroup.com/resources/southwest-florida-housing-market/">Full market snapshot &rarr;</a></div>
  <div class="belt" role="region" aria-label="Southwest Florida market numbers by area">
    <div class="track" id="track"></div>
  </div>
  <div class="foot">Southwest Florida MLS data, refreshed every morning. Median sold price and percent of list price cover sales in the last 45 days (30 in Cape Coral). Information only; not guaranteed.</div>
</div>
<script>
(function () {
  var AREA_URL_FALLBACK = {
    'naples': 'https://communities.theborggroup.com/naples/',
    'bonita-springs': 'https://communities.theborggroup.com/bonita-springs/',
    'beaches': 'https://communities.theborggroup.com/bonita-beach/',
    'estero': 'https://communities.theborggroup.com/estero/',
    'fort-myers': 'https://communities.theborggroup.com/fort-myers/',
    'cape-coral': 'https://communities.theborggroup.com/cape-coral/'
  };
  var ORDER = ['naples', 'bonita-springs', 'beaches', 'estero', 'fort-myers', 'cape-coral'];
  function k(n) {
    if (n == null) return '';
    if (n >= 1e6) return '$' + (n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace(/\.?0+$/, '') + 'M';
    return '$' + Math.round(n / 1000) + 'K';
  }
  function num(n) { return Number(n).toLocaleString('en-US'); }
  function seg(label, s, a) {
    if (!s || (!s.active && !s.sold && !s.pending)) return '';
    var parts = [];
    if (s.active && !a.activeMissing) parts.push('<b>' + num(s.active) + '</b> for sale');
    if (s.pending != null && s.pending) parts.push('<b>' + num(s.pending) + '</b> pending');
    if (s.medianSold) parts.push('median sold <b>' + k(s.medianSold) + '</b>');
    if (s.saleToList) parts.push('<b>' + s.saleToList + '%</b> of list');
    return '<span class="seg"><span class="t">' + label + '</span>' + parts.join(' <span class="sep">&middot;</span> ') + '</span>';
  }
  function render(d) {
    var byId = {}; d.areas.forEach(function (a) { byId[a.id] = a; });
    var html = ORDER.filter(function (id) { return byId[id]; }).map(function (id) {
      var a = byId[id];
      var name = String(a.name).replace(/&/g, '&amp;');
      return '<a class="item" target="_top" href="' + (a.url || AREA_URL_FALLBACK[id]) + '"><span class="area">' + name + '</span>' +
        seg('Single-family', a.sf, a) + '<span class="sep">|</span>' + seg('Condo', a.condo, a) +
        '<span class="go" aria-hidden="true">&rarr;</span></a>';
    }).join('');
    var t = document.getElementById('track');
    t.innerHTML = html + '<span class="dup" aria-hidden="true" style="display:contents">' + html.replace(/<a /g, '<a tabindex="-1" ') + '</span>';
    t.style.setProperty('--dur', Math.max(60, ORDER.length * 16) + 's');
    document.getElementById('upd').textContent = '· Updated ' + d.updatedLabel;
  }
  fetch('/data/market-ticker.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(render).catch(function () {
    document.querySelector('.wrap').style.display = 'none';
  });
})();
</script>
</body>
</html>
